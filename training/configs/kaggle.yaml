# Second run on Kaggle (GPU T4, ~4 CPUs). Starts from the Mac's checkpoint (ckpt-A release) with a
# different seed, so it explores differently. ~11 h max (Kaggle sessions stop at 12 h).
run_name: kaggle_b
n_workers: 3
envs_per_worker: 6
rollout: 128
seq_len: 32
epochs: 2
minibatches: 4
device: cuda
seed: 1
total_steps: 25000000
phase_a_end: 3000000
phase_b_end: 10000000
ckpt_every: 8
max_hours: 11
tier_weights: [0.2, 0.3, 0.3, 0.2]
init_ckpt: /kaggle/working/ckpt_A.pt
