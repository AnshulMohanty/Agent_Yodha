# Main Mac run (MacBook Air M5): 8 worker processes x 4 games, learner on the Apple GPU (MPS).
# ~450-500 env steps/s -> ~1.7M steps/hour.
run_name: mac_main
n_workers: 8
envs_per_worker: 4
rollout: 128
seq_len: 32
epochs: 2
minibatches: 4
device: mps
total_steps: 30000000   # 27 Nov 05:05: LR had hit its 10% floor; 30M puts it back to ~35% for the last push
phase_a_end: 3000000      # DAgger warm-up (copy the honest teacher)
phase_b_end: 10000000     # kickstarted PPO (teacher weight 1 -> 0.1)
ckpt_every: 8
max_hours: 6             # restarted 01:30 -> hard stop ~07:30; finalize stops it at 06:45
tier_weights: [0.12, 0.15, 0.23, 0.5]   # 05:05 survival push: T4 gets ~half of the games (was ~35%)
final_ks: 0.02          # 05:05: weaker pull toward the coach (the coach dies on 6/6 held-out T4 maps)
